name: CI

# Runs on every pull request and every push to main: formatting, typecheck,
# lint, unit tests, production build, and Chromium browser tests. Deployment only
# runs on main, so a PR that breaks the build is caught here first.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Interaction benchmark
        run: npm run benchmark -- ci-large --large

      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-measurements
          path: |
            tmp/performance/*.json
            test-results/**/performance-measurements.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload print verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-verification
          path: test-results/**/print-proof.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
